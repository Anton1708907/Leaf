<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Особистий кабінет</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; padding: 2em; background: #f4f4f4; }
    .gpu-card {
      background: white;
      padding: 1em;
      margin-bottom: 1em;
      border-radius: 5px;
      box-shadow: 0 0 4px rgba(0,0,0,0.1);
    }
    form input, form select {
      margin-bottom: 0.5em;
      display: block;
    }
  </style>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
</head>
<body>
  <h1>👤 Особистий кабінет</h1>
  <div id="profile">Завантаження...</div>

  <hr>

  <button id="connectPhantom">🔗 Підключити Phantom</button>
  <p id="walletStatus">⏳ Гаманець не підключено</p>

  <hr>
 <button id="toRent">Орендувати GPU</button>
 <hr>
  <h2>💻 Мої GPU</h2>
  <div id="gpus"></div>

  <hr>

  <h2>➕ Додати GPU</h2>
  <form id="addGpuForm">
    <input type="text" name="model" placeholder="Модель GPU (e.g. RTX 3080)" required><br>
    <input type="number" name="vram_gb" placeholder="VRAM (в ГБ)" required><br>
    <input type="text" name="location" placeholder="Локація (наприклад, Київ)" required><br>
    <input type="number" step="0.01" name="price_per_hour" placeholder="Ціна за годину (SOL)" required><br>
    <button type="submit">Додати</button>
  </form>
  <p id="gpuAddStatus"></p>

  <script>
    let owner_public_key = null;
    const token = localStorage.getItem("jwt");
    const profileDiv = document.getElementById("profile");
    const gpusDiv = document.getElementById("gpus");
    const walletStatus = document.getElementById("walletStatus");
    let currentUserId = null;

    if (!token) {
      alert("⛔ Спочатку увійдіть");
      window.location.href = "login.html";
    }

    async function fetchUser() {
      const res = await fetch("http://localhost:3000/auth/me", {
        headers: { Authorization: "Bearer " + token }
      });
      const user = await res.json();
      currentUserId = user.id;
      profileDiv.innerHTML = `
        <p><strong>Ім’я:</strong> ${user.username}</p>
        <p><strong>Email:</strong> ${user.email}</p>
        <p><strong>Роль:</strong> ${user.role}</p>
      `;
      fetchGPUs(user.id);
    }

    async function fetchGPUs(userId) {
      const res = await fetch(`http://localhost:3000/gpus/user/${userId}`);
      const gpus = await res.json();
      gpusDiv.innerHTML = "";

      if (!gpus.length) {
        gpusDiv.innerHTML = "<p>У вас ще немає GPU.</p>";
        return;
      }

      gpus.forEach(gpu => {
        const card = document.createElement("div");
        card.className = "gpu-card";
        card.innerHTML = `
          <strong>${gpu.model}</strong> (${gpu.vram_gb}GB VRAM)<br>
          Локація: ${gpu.location || '—'}<br>
          Статус: ${gpu.status}<br>
          Ціна: ${gpu.price_per_hour} SOL/год
        `;
        gpusDiv.appendChild(card);
      });
    }

    async function savePublicKey(publicKey) {
      const res = await fetch("http://localhost:3000/wallet/connect-wallet", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token
        },
        body: JSON.stringify({ publicKey })
      });

      const data = await res.json();
      if (data.success) {
        walletStatus.textContent += " ✅ гаманець збережено";
      } else {
        walletStatus.textContent = "❌ Помилка: " + data.error;
      }
    }
    document.getElementById("connectPhantom").onclick = async () => {
      if (!window.solana || !window.solana.isPhantom) {
        return alert("Встановіть Phantom Wallet: https://phantom.app/");
      }

      try {
        const resp = await window.solana.connect();
        owner_public_key = resp.publicKey.toString();
        const publicKey = resp.publicKey.toString();
        walletStatus.textContent = "🔐 Підключено: " + publicKey;
        await savePublicKey(publicKey);
      } catch (err) {
        if (err.code === 77) {
          walletStatus.textContent = "⛔ Ви відхилили запит на підключення";
        } else {
          walletStatus.textContent = "❌ " + err.message;
        }
      }
    };
document.getElementById("toRent").onclick = () => {
  window.location.href = "rent.html";
}
    window.addEventListener("DOMContentLoaded", async () => {
      await fetchUser();

      if (window.solana?.isPhantom) {
        try {
          const res = await window.solana.connect({ onlyIfTrusted: true });
          walletStatus.textContent = "🔐 Автопідключено: " + res.publicKey.toString();
          await savePublicKey(res.publicKey.toString());
        } catch (e) {
          walletStatus.textContent = "⚠️ Phantom не підключено";
        }
      }
    });

    document.getElementById("addGpuForm").onsubmit = async (e) => {
  e.preventDefault();
  const form = e.target;
  const statusField = document.getElementById("gpuAddStatus");

  if (!window.solana?.isPhantom || !window.solana.publicKey) {
    return alert("Будь ласка, підключіть Phantom перед додаванням GPU.");
  }

  const model = form.model.value;
  const vram = parseInt(form.vram_gb.value);
  const location = form.location.value;
  const price = parseFloat(form.price_per_hour.value);
  const specs = `${model} ${vram}GB`;

  try {
    // 1️⃣ Отримуємо транзакцію з бекенду
    const txRes = await fetch("http://localhost:3000/gpus/create-tx", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token,
      },
      body: JSON.stringify({
        specs: specs,
        pubkey: window.solana.publicKey.toString(),
      }),
    });

    const { transaction, gpu_pubkey } = await txRes.json();

    if (!transaction || !gpu_pubkey) {
      statusField.textContent = "❌ Не вдалося створити транзакцію";
      return;
    }

    // 2️⃣ Декодуємо Base64 → Uint8Array
    const rawTx = Uint8Array.from(atob(transaction), (c) => c.charCodeAt(0));
    const tx = solanaWeb3.Transaction.from(rawTx);

    // 3️⃣ Підписуємо через Phantom
    const signedTx = await window.solana.signTransaction(tx);
    const serializedSigned = signedTx.serialize();

    // 4️⃣ Перетворюємо в Base64
    const signedBase64 = btoa(String.fromCharCode(...serializedSigned));

    // 5️⃣ Відправляємо на бекенд
    const submitRes = await fetch("http://localhost:3000/gpus/submit-tx", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token,
      },
      body: JSON.stringify({
        signedTx: signedBase64,
        gpu_pubkey, // pda
        model,
        vram_gb: vram,
        location,
        price_per_hour: price,
        owner_public_key
      }),
    });

    const result = await submitRes.json();

    if (result.success) {
      statusField.textContent = "✅ GPU успішно додано!";
      form.reset();
      fetchGPUs(currentUserId);
    } else {
      statusField.textContent = "❌ " + result.error;
    }

  } catch (err) {
    console.error(err);
    statusField.textContent = "❌ Системна помилка";
  }
};

    fetchUser();
  </script>
</body>
</html>
