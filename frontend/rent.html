<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Оренда GPU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; padding: 2em; background: #f2f2f2; }
    .gpu-card {
      background: white;
      padding: 1em;
      margin-bottom: 1em;
      border-radius: 5px;
      box-shadow: 0 0 3px rgba(0,0,0,0.1);
    }
    .gpu-card input {
      margin-top: 0.5em;
      display: block;
    }
    .gpu-card button {
      margin-top: 0.5em;
    }
  </style>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
</head>
<body>
  <h1>🧠 Орендувати GPU</h1>
  <div id="gpuList">Завантаження...</div>

  <script>
    const token = localStorage.getItem("jwt");
    const gpuList = document.getElementById("gpuList");

    if (!token) {
      alert("⛔ Спочатку увійдіть");
      window.location.href = "login.html";
    }

    async function fetchAvailableGPUs() {
      const res = await fetch("http://localhost:3000/gpus/available");
      const gpus = await res.json();
      gpuList.innerHTML = "";

      if (!gpus.length) {
        gpuList.innerHTML = "<p>Поки немає доступних GPU 😢</p>";
        return;
      }

      gpus.forEach(gpu => {
        const card = document.createElement("div");
        card.className = "gpu-card";
        card.id = `gpu-${gpu.id}`;
        card.innerHTML = `
          <strong>${gpu.model}</strong> (${gpu.vram_gb}GB VRAM)<br>
          Локація: ${gpu.location || "—"}<br>
          Ціна: ${gpu.price_per_hour} SOL/год<br>
          <input type="number" placeholder="Годин для оренди" min="1" id="dur-${gpu.id}" />
          <button onclick="rentGPU('${gpu.id}', '${gpu.price_per_hour}')">Орендувати</button>
          <p id="status-${gpu.id}"></p>
        `;
        gpuList.appendChild(card);
      });
    }

async function rentGPU(gpuId, pricePerHour) {
  const durationInput = document.getElementById(`dur-${gpuId}`);
  const statusMsg = document.getElementById(`status-${gpuId}`);
  const duration = parseInt(durationInput.value);

  if (!duration || duration < 1) {
    alert("Введіть правильну кількість годин");
    return;
  }

  try {
    // 1️⃣ Перевірка та підключення Phantom-гаманця
    if (!window.solana?.isPhantom || !window.solana.publicKey) {
      await window.solana.connect();
    }

    // 2️⃣ Запит на транзакцію до бекенду
    const res = await fetch("http://localhost:3000/session/start", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token
      },
      body: JSON.stringify({
        gpu_id: gpuId,
        duration_hours: duration,
        price_per_hour: parseFloat(pricePerHour)
      })
    });

    const data = await res.json();
    if (!res.ok || !data.tx) {
      statusMsg.textContent = "❌ " + (data.error || "Не вдалося створити транзакцію");
      return;
    }

    // 3️⃣ Десеріалізація транзакції без Buffer!
    const rawTx = Uint8Array.from(atob(data.tx), (c) => c.charCodeAt(0));
    const tx = solanaWeb3.Transaction.from(rawTx);

    // 4️⃣ ОНОВЛЮЄМО blockhash і feePayer НА ФРОНТІ (це critical!)
    const connection = new solanaWeb3.Connection("https://api.devnet.solana.com");
    const { blockhash } = await connection.getLatestBlockhash();
    tx.recentBlockhash = blockhash;
    tx.feePayer = window.solana.publicKey;

    // 5️⃣ Підпис через Phantom
    const signedTx = await window.solana.signTransaction(tx);

    // 6️⃣ Відправка у мережу
    const txid = await connection.sendRawTransaction(signedTx.serialize());
    await connection.confirmTransaction(txid);

    // 7️⃣ Збереження сесії в базу даних
    await fetch("http://localhost:3000/session/save", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({
        session_pubkey: data.sessionPubkey,
        gpu_id: gpuId
      })
    });

    // 8️⃣ Оновлення статусу UI
    statusMsg.innerHTML = `✅ Сесія активна (${duration} год)<br>Tx: <a href="https://explorer.solana.com/tx/${txid}?cluster=devnet" target="_blank">${txid}</a>`;

    // 9️⃣ Кнопка завершення вручну
    const finishBtn = document.createElement("button");
    finishBtn.textContent = "⏹ Завершити вручну";
    finishBtn.onclick = () => endSession(data.sessionPubkey, gpuId);
    statusMsg.appendChild(finishBtn);

    // 🔟 Автоматичне завершення через N годин (опційно)
    setTimeout(() => endSession(data.sessionPubkey, gpuId), duration * 3600 * 1000);

  } catch (err) {
    statusMsg.textContent = "❌ Помилка: не вдалося почати сесію";
    console.error(err);
  }
}

    async function endSession(sessionPubkey, gpuId) {
  const statusMsg = document.getElementById(`status-${gpuId}`);
  try {
    // 1. Отримуємо транзакцію завершення з бекенду
    const res = await fetch("http://localhost:3000/session/end", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({
        session_pubkey: sessionPubkey,
        renter_pubkey: window.solana.publicKey.toString()
      })
    });
    const data = await res.json();
    if (!res.ok || !data.tx) {
      statusMsg.textContent = "❌ Не вдалося завершити сесію";
      return;
    }

    // 2. Підпис і відправка транзакції
    const rawTx = Uint8Array.from(atob(data.tx), (c) => c.charCodeAt(0));
    const tx = solanaWeb3.Transaction.from(rawTx);

    // Додаємо актуальний blockhash і feePayer
    const connection = new solanaWeb3.Connection("https://api.devnet.solana.com");
    const { blockhash } = await connection.getLatestBlockhash();
    tx.recentBlockhash = blockhash;
    tx.feePayer = window.solana.publicKey;

    const signedTx = await window.solana.signTransaction(tx);
    const txid = await connection.sendRawTransaction(signedTx.serialize());
    await connection.confirmTransaction(txid);

    // 3. Оновлюємо статус сесії в БД
    await fetch("http://localhost:3000/session/mark-ended", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({
        session_pubkey: sessionPubkey,
        txid: txid
      })
    });

    statusMsg.innerHTML = `✅ Завершено.<br>Tx: <a href="https://explorer.solana.com/tx/${txid}?cluster=devnet" target="_blank">${txid}</a>`;
  } catch (err) {
    statusMsg.textContent = "❌ Системна помилка";
    console.error(err);
  }
}

    fetchAvailableGPUs();
  </script>
</body>
</html>
